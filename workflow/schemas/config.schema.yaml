$schema: "https://json-schema.org/draft/2020-12/schema"
description: snakemake configuration file
type: object
properties:
  samples:
    type: string
  units:
    type: string
  output:
    type: string
    description: output yaml/json file defining expected output from pipeline
  resources:
    type: string
    description: Path to resources.yaml file
  default_container:
    type: string
    description: name or path to a default docker/singularity container
  pipeline_version:
    type: string
  module_versions:
    type: object
    properties:
      alignment:
        type: string
      annotation:
        type: string
      cnv_sv:
        type: string
      filtering:
        type: string
      prealignment:
        type: string
      references:
        type: string
      reports:
        type: string
      snv_indels:
        type: string
      qc:
        type: string
  reference:
    type: object
    properties:
      fasta:
        type: string
      fai:
        type: string
      trf:
        type: string
      design_bed:
        type: string
      mappability:
        type: string
      severus_pon:
        type: string
      jumble_annotation:
        type: string
        description: path to a Jumble gene-annotation .RDS file, see jumble_reference.annotation
    required:
      - fasta
      - design_bed
  aligner:
    type: string
  haplotag_path:
    type: string
  haplotag_suffix:
    type: string
  trimmer_software:
    type: string
  bcftools_merge:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string
  cnvkit_create_targets:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string
  cnvkit_create_anti_targets:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string
  cnvkit_build_normal_reference:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string
  deepsomatic_pon:
    type: object
    properties:
      container:
        type: string
      model:
        type: string
      extra:
        type: string
  jumble_count:
    type: object
    description: per-sample read counts over the design bed, input for jumble_reference
    properties:
      container:
        type: string
      benchmark_repeats:
        type: integer
  jumble_reference:
    type: object
    description: builds the Jumble panel of normals (.RDS) from all jumble_count outputs
    properties:
      container:
        type: string
      annotation:
        type: string
        description: >-
          gene annotation source passed to jumble-reference.R -a. Either the literal
          string "biomart" (fetches from Ensembl, needs network access on the compute
          node) or a path to a pre-built annotation .RDS file, absolute or relative to the
          working directory as with every other reference path. A path that is
          neither is rejected by Jumble with "Invalid annotation source."
      benchmark_repeats:
        type: integer
  mosdepth:
    type: object
    properties:
      container:
        type: string
      by:
        type: string
      extra:
        type: string
  multiqc:
    type: object
    properties:
      container:
        type: string
      reports:
        type: object
        additionalProperties:
          type: object
          properties:
            included_unit_types:
              type: array
              items:
                type: string
            qc_files:
              type: array
              items:
                type: string
          required:
            - included_unit_types
            - qc_files
  pbmarkdup:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string
  pbmm2_index:
    type: object
    properties:
      container:
        type: string
      preset:
        type: string
      extra:
        type: string
  pbmm2_align:
    type: object
    properties:
      container:
        type: string
      preset:
        type: string
      extra:
        type: string
  pbmm2_merge:
    type: object
    properties:
      container:
        type: string
  pbsv_discover:
    type: object
    properties:
      container:
        type: string
      trf:
        type: string
      extra:
        type: string
  pbsv_call:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string
  picard_collect_alignment_summary_metrics:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string
  picard_collect_hs_metrics:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string
  sequali:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string
  severus_t_only:
    type: object
    properties:
      container:
        type: string
      vntr:
        type: string
      pon:
        type: string
      severus_pon:
        type: string
      extra:
        type: string
  sniffles2_call:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string
  vacmap_align:
    type: object
    properties:
      container:
        type: string
      mode:
        type: string
  whatshap_phase:
    type: object
    properties:
      container:
        type: string
      extra:
        type: string

required:
  - samples
  - units
  - output
  - resources
  - default_container
